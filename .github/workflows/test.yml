name: Test

on:
  push:

jobs:
  build-gradle-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check i18n parity
        run: python3 scripts/check_i18n_keys.py --all

      - name: Check packs consistency
        run: python3 scripts/check_packs_consistency.py

      - name: Check document lookups
        run: python3 scripts/check_uuid_lookups.py

      - name: Check Handlebars scope
        run: python3 scripts/check_hbs_scope.py

      - name: Check sheet submit merges
        run: python3 scripts/check_submit_merges.py

      - name: Check dead engine cores
        run: python3 scripts/check_dead_cores.py

      - name: Check Kingmaker hook names
        run: python3 scripts/check_hook_names.py

      - name: Check chat-button dataset keys
        run: python3 scripts/check_chat_dataset_keys.py

      - name: Run build
        run: ./gradlew build
