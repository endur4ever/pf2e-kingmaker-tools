name: Test

on:
  push:

jobs:
  build-gradle-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project sources
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check i18n parity
        run: python3 scripts/check_i18n_keys.py --all

      - name: Check packs consistency
        run: python3 scripts/check_packs_consistency.py

      - name: Check document lookups
        run: python3 scripts/check_uuid_lookups.py

      - name: Run build
        run: ./gradlew build
